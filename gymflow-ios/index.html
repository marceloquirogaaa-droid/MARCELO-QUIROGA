<!doctype html>
<!-- GymFlow iPhone 1.5.30 DNI -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymFlow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://kyxkisnnknymuxqrwxzv.supabase.co/functions/v1/gymflow-ios-source/icon.png">
  <title>GymFlow</title>
  <style>
    html,body{height:100%;margin:0;background:#0b0d0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .load{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:420px}.logo{font-size:42px;font-weight:900;letter-spacing:-1px}.muted{color:#9aa3aa;line-height:1.5}
    .spin{width:34px;height:34px;border:3px solid #2a3034;border-top-color:#55e69c;border-radius:50%;margin:24px auto;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:#55e69c;color:#08110d}
  </style>
</head>
<body>
  <div class="load"><div class="box"><div class="logo">GymFlow</div><div class="spin"></div><p class="muted" id="msg">Cargando GymFlow 1.5.30…</p></div></div>
  <script>
  (async function(){
    const SOURCE="https://kyxkisnnknymuxqrwxzv.supabase.co/functions/v1/gymflow-ios-source";
    try{
      const r=await fetch(SOURCE+"?host=github&t="+Date.now(),{cache:"no-store",mode:"cors"});
      if(!r.ok) throw new Error("Servidor "+r.status);
      let html=await r.text();
      html=html.replaceAll("/functions/v1/gymflow-ios-source",SOURCE);
      html=html.replace(/<link rel="manifest" href="[^"]*">/i,'<link rel="manifest" href="./manifest.webmanifest">');
      html=html.replace(/<link rel="apple-touch-icon" href="[^"]*">/i,'<link rel="apple-touch-icon" href="'+SOURCE+'/icon.png">');
      html=html.replace("</body>",'<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}<\/script></body>');
      document.open();
      document.write(html);
      document.close();
    }catch(e){
      const m=document.getElementById("msg");
      if(m)m.innerHTML="No se pudo cargar GymFlow.<br><br>"+String(e&&e.message?e.message:e)+'<br><br><button onclick="location.reload()">REINTENTAR</button>';
    }
  })();
  </script>
</body>
</html>
